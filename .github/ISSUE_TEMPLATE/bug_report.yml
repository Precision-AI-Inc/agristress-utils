name: Bug report
description: Report a problem with precisionai-agristress-utils
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code, CLI command, or API request that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: precisionai-agristress-utils version
      description: Output of `pip show precisionai-agristress-utils`.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and OS
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
