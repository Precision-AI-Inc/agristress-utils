[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-agribench-utils"
version = "0.1.0"
description = "Dataset utilities for AgriBench — HuggingFace download, metadata lookup, and retrieval payload assembly for the PAI embedding evaluator."
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["precisionai*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=precisionai --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["precisionai"]
omit = ["*/tests/*", "*/__init__.py"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]

# ── pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "ANN",  # flake8-annotations — enforce PEP 484 type hints
    "PERF", # perflint — performance anti-patterns
    "S",    # flake8-bandit — security linting
]
ignore = [
    "E501",    # line too long — enforced by ruff-format at 120 chars
    "SIM108",  # ternary operator — sometimes less readable
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — common in evaluation functions
    "PLR2004", # magic value comparisons — acceptable in tests/metrics
    "ANN401",  # typing.Any is allowed for genuinely dynamic types
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**"       = ["D", "PLR", "ANN", "S"]
"docs/conf.py"   = ["E402", "UP031", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["precisionai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
